<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>앵커 태그 2단계-다양한 링크</title>
</head>
<body id="top">
    <h1></h1>
    <p>
        <p>

    </p>
    <!--① 새 창 링크 + 보안 속성 ref~~-->
    <!--"target=_black"를 적용할 때 rel="noopener noreferrer"를 적용해야 보안에 안전-->
    <h2>①새 창/현재 창 링크</h2>
    <p>
        <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">구글(새 창)</a> 
        <a href="https://www.google.com" target="_self" rel="noopener noreferrer">구글(새 창)</a>
<!--메일보내기: 제목 (Subject)과 본문(Body)까지 미리 채우기-->
        <!--띄어쓰기는 %20, 여러 값을 &로 연결-->
        <h2>②메일 보내기: 제목(Subject)과 본문(Body)까지 미리 채우기</h2>
<p>
    <a href="mailto:aquabin@gmail.com?subject=수강%20문의&body=안녕하세요.%30수강문의드립니다." 
    target="_blank" rel="noopener noreferrer">수강 문의 메일 보내기</a>
</p>

<!--3. 전화걸기 : 스마트폰에서 누르면 전화 앱이 얼림-->
<h2></h2>
<p>
    <a></a>
</p>

<!--4. 같은 폴더의 다른 HTML파일로 이동(상대경로)-->

<h2></h2>
    <p>
        <a href="#"></a>
    </p>

    <!--5. 이미지 링크 걸기 :a태그 안에 img 넣기-->

<h2></h2>
    <p>
        <a href="#"></a>
    </p>

    <!--6. 파일 다운로드 : download 속성(같은 사이트)-->
    <h2></h2>
    <p>
        <a href="#"></a>
    </p>
    

    <!--스크롤 공간 확보-->
    <div></div>


    <!--7. 맨 위로 이동: body 태그에 id값 id="top" 적용 후 이동-->
    <p>
        <a href="#top"> ▲맨 위로</a>
    </p>
</body>
</html>
